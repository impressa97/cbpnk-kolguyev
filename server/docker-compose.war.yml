# Kolguyev war: an override for docker-compose.yml.
#
# The server starts in its command-line mode (-server + -addons) instead of the image's
# launcher with a -config file: with a config every mod must be on the Workshop, this way the
# addon is loaded from profile/localaddons as Workbench packs it (-packAddon) and
# nothing has to be published. Scenario: the vanilla Game Master Kolguyev.
# Clean start every time: no session save, the mod rebuilds the island from the headquarters.
services:
  reforger:
    working_dir: /reforger
    entrypoint: ["./ArmaReforgerServer"]
    command:
      - -server
      - "{F45C6C15D31252E6}Missions/27_GM_Cain.conf"
      - -addonsDir
      - /home/profile/localaddons
      - -addons
      - 53D18422A46F789F
      - -profile
      - /home/profile
      - -bindPort
      - "${GAME_PORT:-2001}"
      - -maxFPS
      - "${ARMA_MAX_FPS:-60}"
      - -backendlog
      - -nothrow
      - -loadSessionSave
      - "false"
      # No config file, so A2S has to be asked for here: the image's healthcheck and the
      # site's player count query it.
      - -a2sIpAddress
      - 0.0.0.0
      - -a2sPort
      - "${A2S_PORT:-17777}"
